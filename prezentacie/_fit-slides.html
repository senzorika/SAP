<script>
// Shrinks the text and diagrams of a slide until the whole slide fits the
// screen; a slide that still does not fit at the smallest size becomes
// scrollable.
(function () {
  var MIN_TEXT = 55, MIN_DIAGRAM = 0.4;

  function diagrams(slide) {
    return Array.prototype.filter.call(slide.querySelectorAll('svg[id^="mermaid"]'), function (svg) {
      if (!svg.dataset.fitW) {
        var box = svg.getBoundingClientRect(), scale = Reveal.getScale() || 1;
        if (!box.width || !box.height) return false;
        svg.dataset.fitW = box.width / scale;
        svg.dataset.fitH = box.height / scale;
      }
      return true;
    });
  }

  // Bottom edge of the slide content; scrollHeight is no use here because it
  // never drops below the height of the slide itself.
  function contentHeight(slide) {
    var bottom = 0;
    Array.prototype.forEach.call(slide.children, function (child) {
      if (child.offsetParent === slide) bottom = Math.max(bottom, child.offsetTop + child.offsetHeight);
    });
    return bottom;
  }

  function fit(slide) {
    if (!slide || slide.classList.contains('scrollable') || slide.classList.contains('stack')) return;
    // Keep a margin for the slide number and menu at the bottom edge.
    var height = Reveal.getConfig().height - 28;
    var display = slide.style.display;
    slide.style.display = 'block';
    slide.style.fontSize = '';
    slide.style.maxHeight = '';
    slide.style.overflowY = '';
    var svgs = diagrams(slide);
    var text = 100, diagram = 1;
    function apply() {
      slide.style.fontSize = text < 100 ? text + '%' : '';
      svgs.forEach(function (svg) {
        svg.style.maxWidth = 'none';
        svg.style.width = svg.dataset.fitW * diagram + 'px';
        svg.style.height = svg.dataset.fitH * diagram + 'px';
      });
    }
    apply();
    while (contentHeight(slide) > height && (text > MIN_TEXT || (svgs.length && diagram > MIN_DIAGRAM))) {
      if (text > MIN_TEXT) text -= 3;
      if (svgs.length && diagram > MIN_DIAGRAM) diagram *= 0.93;
      apply();
    }
    if (contentHeight(slide) > height) {
      slide.style.maxHeight = height + 'px';
      slide.style.overflowY = 'auto';
    }
    slide.style.display = display;
  }

  function fitAll() { Reveal.getSlides().forEach(fit); }
  function start() {
    fitAll();
    // Diagrams and calculators finish rendering after the deck is ready.
    setTimeout(fitAll, 1500);
    Reveal.on('slidechanged', function (e) { fit(e.currentSlide); });
  }
  if (Reveal.isReady()) start(); else Reveal.on('ready', start);
})();
</script>
